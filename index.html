<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080d18;
  color: #eaf0ff;
  font-family: Arial, sans-serif;
  height: 100dvh;
  overflow: hidden;
}

button, input, textarea {
  font: inherit;
}

button {
  cursor: pointer;
  border: 1px solid #25334c;
  color: #eaf0ff;
  background: #131e30;
  border-radius: 12px;
  padding: 11px 14px;
}

button:hover {
  background: #20304a;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.app {
  height: 100dvh;
  display: flex;
}

.sidebar {
  width: 270px;
  background: #0c1423;
  border-right: 1px solid #1d2b40;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.logo {
  font-size: 23px;
  font-weight: bold;
  padding: 10px;
  color: #62c9ff;
}

.newchat {
  width: 100%;
}

.history-title {
  color: #93a7c5;
  margin: 12px 4px 4px;
  font-size: 13px;
}

.history-list {
  overflow-y: auto;
  flex: 1;
}

.history-item {
  width: 100%;
  display: block;
  text-align: left;
  margin-bottom: 7px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sidebar-bottom {
  display: grid;
  gap: 8px;
}

.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.topbar {
  height: 65px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 18px;
  border-bottom: 1px solid #1d2b40;
}

.topbar-title {
  font-weight: bold;
  flex: 1;
}

.status {
  color: #6de0a7;
  font-size: 12px;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 22px 15px;
}

.welcome {
  text-align: center;
  margin: 12vh auto 25px;
  max-width: 600px;
}

.welcome h1 {
  font-size: 30px;
  color: #64caff;
}

.welcome p {
  color: #91a2bb;
}

.message {
  max-width: 850px;
  margin: 0 auto 18px;
  display: flex;
  gap: 10px;
  align-items: flex-start;
}

.avatar {
  min-width: 34px;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: #162741;
}

.bubble {
  padding: 13px 15px;
  background: #111d30;
  border: 1px solid #20304a;
  border-radius: 14px;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  width: fit-content;
  max-width: 100%;
}

.user .bubble {
  background: #14324d;
}

.message-actions {
  margin-top: 6px;
  display: flex;
  gap: 6px;
}

.message-actions button {
  padding: 5px 9px;
  font-size: 12px;
}

.composer-area {
  padding: 12px 15px 16px;
  border-top: 1px solid #1d2b40;
}

.composer {
  max-width: 850px;
  margin: auto;
  display: flex;
  gap: 8px;
  align-items: flex-end;
  background: #111d30;
  border: 1px solid #2a3a53;
  border-radius: 16px;
  padding: 8px;
}

#messageInput {
  flex: 1;
  background: transparent;
  color: white;
  border: none;
  outline: none;
  resize: none;
  padding: 10px;
  max-height: 140px;
  min-height: 42px;
}

.send-btn {
  background: #087bc2;
  border-color: #087bc2;
  font-weight: bold;
}

.send-btn:hover {
  background: #0998ed;
}

.footer-note {
  text-align: center;
  color: #64748b;
  font-size: 11px;
  margin-top: 9px;
}

.mobile-menu {
  display: none;
}

.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: #0009;
  z-index: 20;
}

.overlay.show {
  display: block;
}

.modal {
  display: none;
  position: fixed;
  z-index: 30;
  inset: 0;
  align-items: center;
  justify-content: center;
  padding: 15px;
}

.modal.show {
  display: flex;
}

.modal-box {
  width: min(500px, 100%);
  background: #111d30;
  border: 1px solid #30415c;
  border-radius: 18px;
  padding: 20px;
}

.modal-box h2 {
  margin-top: 0;
}

.modal-box input {
  width: 100%;
  padding: 12px;
  margin: 8px 0 15px;
  border: 1px solid #34445c;
  border-radius: 10px;
  color: white;
  background: #08111e;
}

.modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}

#toast {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%);
  background: #20334c;
  padding: 12px 18px;
  border-radius: 12px;
  display: none;
  z-index: 50;
  max-width: 90%;
  text-align: center;
}

@media(max-width:700px) {
  .sidebar {
    position: fixed;
    z-index: 25;
    left: -280px;
    top: 0;
    bottom: 0;
    transition: left .2s;
  }

  .sidebar.open {
    left: 0;
  }

  .mobile-menu {
    display: inline-block;
  }

  .topbar {
    padding: 0 10px;
  }

  .messages {
    padding: 15px 10px;
  }

  .composer-area {
    padding: 8px;
  }

  .bubble {
    font-size: 15px;
  }

  .welcome h1 {
    font-size: 25px;
  }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="logo">⚡ JARVIS AI</div>

    <button class="newchat" id="newChatBtn">＋ New Chat</button>

    <div class="history-title">CHAT HISTORY</div>
    <div class="history-list" id="historyList"></div>

    <div class="sidebar-bottom">
      <button id="settingsBtn">⚙️ Settings</button>
      <button id="clearHistoryBtn">🗑 Clear History</button>
    </div>
  </aside>

  <main class="main">

    <header class="topbar">
      <button class="mobile-menu" id="menuBtn">☰</button>
      <div class="topbar-title">Jarvis Assistant</div>
      <div class="status" id="status">Ready</div>
    </header>

    <section class="messages" id="messages">

      <div class="welcome" id="welcome">
        <h1>नमस्ते! मैं Jarvis हूँ ⚡</h1>
        <p>आप मुझसे कुछ भी पूछ सकते हैं।</p>
      </div>

    </section>

    <div class="composer-area">

      <div class="composer">

        <button id="voiceBtn" title="Voice Input">🎤</button>

        <textarea
          id="messageInput"
          placeholder="Jarvis से कुछ पूछें..."
          rows="1"
        ></textarea>

        <button class="send-btn" id="sendBtn">➤ Send</button>

      </div>

      <div class="footer-note">
        Jarvis AI • AI उत्तर गलत भी हो सकते हैं
      </div>

    </div>

  </main>

</div>

<div class="overlay" id="overlay"></div>

<div class="modal" id="settingsModal">
  <div class="modal-box">
    <h2>⚙️ Settings</h2>

    <label>Supabase Project URL</label>
    <input id="supabaseUrl" placeholder="https://YOURPROJECT.supabase.co">

    <label>Supabase Anon / Publishable Key</label>
    <input id="supabaseKey" placeholder="Public anon key">

    <label>Edge Function Name</label>
    <input id="functionName" placeholder="jarvis-chat">

    <p style="color:#9aabc3;font-size:12px">
      Secret Gemini API Key यहाँ न डालें।
      Gemini Key Supabase Secrets में सुरक्षित रखें।
    </p>

    <div class="modal-actions">
      <button id="closeSettingsBtn">Cancel</button>
      <button id="saveSettingsBtn" class="send-btn">Save</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
(() => {
"use strict";

/* ===============================
   CONFIGURATION
================================ */

const DEFAULT_URL =
  "https://aeflfnlpkbnlhbkghwav.supabase.co";

const DEFAULT_FUNCTION =
  "jarvis-chat";

/* ===============================
   ELEMENTS
================================ */

const $ = id => document.getElementById(id);

const messagesEl = $("messages");
const inputEl = $("messageInput");
const sendBtn = $("sendBtn");
const statusEl = $("status");
const historyList = $("historyList");
const welcome = $("welcome");

let sending = false;
let currentChatId = null;
let chats = loadChats();

/* ===============================
   STORAGE
================================ */

function loadChats() {
  try {
    const data = JSON.parse(
      localStorage.getItem("jarvis_chats") || "[]"
    );

    return Array.isArray(data) ? data : [];
  } catch {
    return [];
  }
}

function saveChats() {
  try {
    localStorage.setItem(
      "jarvis_chats",
      JSON.stringify(chats)
    );
  } catch (e) {
    toast("History save नहीं हो सकी");
  }
}

function getSettings() {
  return {
    url: localStorage.getItem("jarvis_url") || DEFAULT_URL,
    key: localStorage.getItem("jarvis_key") || "",
    functionName:
      localStorage.getItem("jarvis_function") ||
      DEFAULT_FUNCTION
  };
}

/* ===============================
   UTILITIES
================================ */

function toast(message) {
  const el = $("toast");
  el.textContent = message;
  el.style.display = "block";

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(() => {
    el.style.display = "none";
  }, 3000);
}

function setStatus(text) {
  statusEl.textContent = text;
}

function scrollBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function createId() {
  return Date.now().toString() +
    Math.random().toString(16).slice(2);
}

function closeSidebar() {
  $("sidebar").classList.remove("open");
  $("overlay").classList.remove("show");
}

function escapeText(text) {
  return String(text ?? "");
}

/* ===============================
   CHAT MANAGEMENT
================================ */

function getCurrentChat() {
  return chats.find(c => c.id === currentChatId);
}

function createNewChat() {
  currentChatId = createId();

  chats.unshift({
    id: currentChatId,
    title: "New Chat",
    messages: [],
    createdAt: Date.now()
  });

  saveChats();
  renderChat();
  renderHistory();

  inputEl.focus();
  closeSidebar();
}

function saveMessage(role, text) {
  let chat = getCurrentChat();

  if (!chat) {
    createNewChat();
    chat = getCurrentChat();
  }

  chat.messages.push({
    role,
    content: text,
    time: Date.now()
  });

  if (
    chat.title === "New Chat" &&
    role === "user"
  ) {
    chat.title = text.slice(0, 40);
  }

  saveChats();
  renderHistory();
}

function openChat(id) {
  currentChatId = id;
  renderChat();
  closeSidebar();
}

function deleteChat(id) {
  chats = chats.filter(c => c.id !== id);

  if (currentChatId === id) {
    currentChatId = null;
  }

  saveChats();
  renderHistory();
  renderChat();

  toast("Chat deleted");
}

function clearHistory() {
  if (!confirm("सभी Chat History हटानी है?")) {
    return;
  }

  chats = [];
  currentChatId = null;

  saveChats();
  renderHistory();
  renderChat();

  toast("History साफ हो गई");
}

/* ===============================
   RENDER CHAT
================================ */

function addMessageUI(role, text) {
  const row = document.createElement("div");
  row.className = "message " + role;

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "👤" : "⚡";

  const content = document.createElement("div");

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = escapeText(text);

  content.appendChild(bubble);

  if (role === "assistant") {
    const actions = document.createElement("div");
    actions.className = "message-actions";

    const copyBtn = document.createElement("button");
    copyBtn.textContent = "📋 Copy";

    copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(text);
        toast("Copied");
      } catch {
        toast("Copy नहीं हो सका");
      }
    });

    actions.appendChild(copyBtn);
    content.appendChild(actions);
  }

  row.appendChild(avatar);
  row.appendChild(content);

  messagesEl.appendChild(row);
}

function renderChat() {
  messagesEl.innerHTML = "";

  const chat = getCurrentChat();

  if (!chat || !chat.messages.length) {
    const w = document.createElement("div");
    w.className = "welcome";
    w.innerHTML =
      "<h1>नमस्ते! मैं Jarvis हूँ ⚡</h1>" +
      "<p>आप मुझसे कुछ भी पूछ सकते हैं।</p>";

    messagesEl.appendChild(w);
    return;
  }

  chat.messages.forEach(msg => {
    addMessageUI(msg.role, msg.content);
  });

  scrollBottom();
}

function renderHistory() {
  historyList.innerHTML = "";

  chats.forEach(chat => {
    const btn = document.createElement("button");
    btn.className = "history-item";
    btn.textContent = chat.title || "New Chat";

    btn.addEventListener("click", () => {
      openChat(chat.id);
    });

    btn.addEventListener("contextmenu", e => {
      e.preventDefault();

      if (confirm("इस Chat को Delete करें?")) {
        deleteChat(chat.id);
      }
    });

    historyList.appendChild(btn);
  });
}

/* ===============================
   GEMINI / SUPABASE REQUEST
================================ */

async function sendToAI(userText) {
  const settings = getSettings();

  if (!settings.url || !settings.key) {
    throw new Error(
      "Settings में Supabase URL और Public Key सेट करें।"
    );
  }

  const endpoint =
    settings.url.replace(/\/+$/, "") +
    "/functions/v1/" +
    settings.functionName;

  const chat = getCurrentChat();

  const history = chat.messages
    .slice(-20)
    .map(m => ({
      role: m.role === "assistant" ? "assistant" : "user",
      content: m.content
    }));

  const response = await fetch(endpoint, {
    method: "POST",

    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + settings.key,
      "apikey": settings.key
    },

    body: JSON.stringify({
      message: userText,
      history: history
    })
  });

  const raw = await response.text();

  let data = {};

  try {
    data = JSON.parse(raw);
  } catch {
    data = { reply: raw };
  }

  if (!response.ok) {
    const message =
      data.error ||
      data.message ||
      raw ||
      "Server Error";

    throw new Error(
      "HTTP " + response.status + ": " + message
    );
  }

  const reply =
    data.reply ||
    data.response ||
    data.message ||
    data.text ||
    data.answer ||
    data.output ||
    data.result?.text ||
    data.candidates?.[0]?.content?.parts?.[0]?.text;

  if (!reply) {
    throw new Error(
      "Server से जवाब खाली आया। Function Response: " +
      raw.slice(0, 300)
    );
  }

  return String(reply);
}

/* ===============================
   SEND MESSAGE
================================ */

async function sendMessage() {
  if (sending) return;

  const text = inputEl.value.trim();

  if (!text) {
    toast("पहले अपना Message लिखें");
    inputEl.focus();
    return;
  }

  const settings = getSettings();

  if (!settings.key) {
    openSettings();
    toast("पहले Supabase Public Key सेट करें");
    return;
  }

  if (!currentChatId) {
    createNewChat();
  }

  sending = true;
  sendBtn.disabled = true;
  inputEl.disabled = true;
  setStatus("Thinking...");

  saveMessage("user", text);
  addMessageUI("user", text);

  inputEl.value = "";
  inputEl.style.height = "42px";

  const loading = document.createElement("div");
  loading.className = "message";
  loading.id = "loadingMessage";

  loading.innerHTML =
    '<div class="avatar">⚡</div>' +
    '<div class="bubble">Jarvis सोच रहा है...</div>';

  messagesEl.appendChild(loading);
  scrollBottom();

  try {
    const reply = await sendToAI(text);

    $("loadingMessage")?.remove();

    saveMessage("assistant", reply);
    addMessageUI("assistant", reply);

    setStatus("Ready");

  } catch (error) {
    $("loadingMessage")?.remove();

    const errorText =
      "⚠️ " + (error.message || "Unknown Error");

    addMessageUI("assistant", errorText);

    saveMessage("assistant", errorText);

    setStatus("Error");

    console.error("JARVIS ERROR:", error);

  } finally {
    sending = false;
    sendBtn.disabled = false;
    inputEl.disabled = false;
    inputEl.focus();
    scrollBottom();
  }
}

/* ===============================
   SETTINGS
================================ */

function openSettings() {
  const settings = getSettings();

  $("supabaseUrl").value = settings.url;
  $("supabaseKey").value = settings.key;
  $("functionName").value = settings.functionName;

  $("settingsModal").classList.add("show");
}

function closeSettings() {
  $("settingsModal").classList.remove("show");
}

function saveSettings() {
  const url = $("supabaseUrl").value.trim();
  const key = $("supabaseKey").value.trim();
  const functionName =
    $("functionName").value.trim();

  if (!url || !key || !functionName) {
    toast("सभी Settings भरें");
    return;
  }

  if (!url.startsWith("https://")) {
    toast("Supabase URL सही नहीं है");
    return;
  }

  localStorage.setItem("jarvis_url", url);
  localStorage.setItem("jarvis_key", key);
  localStorage.setItem("jarvis_function", functionName);

  closeSettings();
  toast("Settings Saved ✓");
}

/* ===============================
   VOICE INPUT
================================ */

function voiceInput() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    toast("इस Browser में Voice Input उपलब्ध नहीं है");
    return;
  }

  const recognition = new SpeechRecognition();

  recognition.lang = "hi-IN";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  $("voiceBtn").disabled = true;
  setStatus("Listening...");

  recognition.onresult = event => {
    const spoken =
      event.results[0][0].transcript;

    inputEl.value +=
      (inputEl.value ? " " : "") + spoken;

    inputEl.focus();
  };

  recognition.onerror = event => {
    toast("Voice Error: " + event.error);
  };

  recognition.onend = () => {
    $("voiceBtn").disabled = false;
    setStatus("Ready");
  };

  try {
    recognition.start();
  } catch (e) {
    $("voiceBtn").disabled = false;
    toast("Voice शुरू नहीं हो सका");
  }
}

/* ===============================
   BUTTON EVENTS
================================ */

$("sendBtn").addEventListener("click", sendMessage);

inputEl.addEventListener("keydown", event => {
  if (
    event.key === "Enter" &&
    !event.shiftKey
  ) {
    event.preventDefault();
    sendMessage();
  }
});

inputEl.addEventListener("input", () => {
  inputEl.style.height = "42px";

  inputEl.style.height =
    Math.min(inputEl.scrollHeight, 140) + "px";
});

$("newChatBtn").addEventListener(
  "click",
  createNewChat
);

$("settingsBtn").addEventListener(
  "click",
  openSettings
);

$("saveSettingsBtn").addEventListener(
  "click",
  saveSettings
);

$("closeSettingsBtn").addEventListener(
  "click",
  closeSettings
);

$("clearHistoryBtn").addEventListener(
  "click",
  clearHistory
);

$("voiceBtn").addEventListener(
  "click",
  voiceInput
);

$("menuBtn").addEventListener("click", () => {
  $("sidebar").classList.add("open");
  $("overlay").classList.add("show");
});

$("overlay").addEventListener("click", () => {
  closeSidebar();
});

/* ===============================
   STARTUP
================================ */

function initialize() {
  renderHistory();

  if (chats.length) {
    currentChatId = chats[0].id;
    renderChat();
  } else {
    currentChatId = null;
    renderChat();
  }

  setStatus("Ready");

  console.log("Jarvis initialized successfully");
}

initialize();

})();
</script>

</body>
   </html>
