
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jarvis AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:#edf3ff;font-family:Arial,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.layout{display:flex;min-height:100vh}
.sidebar{width:220px;background:#101827;padding:15px;position:fixed;height:100vh;overflow:auto}
.logo{font-size:23px;font-weight:bold;margin:10px 0 22px}
.logo span{color:#39caff}
.navbtn{display:block;width:100%;padding:13px;margin:5px 0;text-align:left;background:#172338;border:1px solid #263851;color:white;border-radius:10px}
.navbtn:hover{background:#254267}
.main{margin-left:220px;padding:20px;width:calc(100% - 220px)}
.page{display:none}
.page.show{display:block}
.card{background:#111c2f;border:1px solid #273952;border-radius:15px;padding:16px;margin-bottom:15px}
h1{font-size:23px}
h2{font-size:19px;margin-top:0}
p{color:#b5c4da;line-height:1.6}
input,textarea,select{width:100%;padding:12px;background:#091221;color:white;border:1px solid #30425c;border-radius:9px;margin:7px 0}
textarea{min-height:100px}
.btn{background:#287bff;border:0;border-radius:9px;padding:12px;color:white;margin:5px 0}
.btn2{background:#30435e}
.full{width:100%}
.chatbox{height:45vh;min-height:250px;overflow:auto;border:1px solid #2c3f5b;background:#07101e;border-radius:12px;padding:10px}
.msg{padding:10px;margin:8px 0;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere}
.user{background:#1d3c65;margin-left:15%}
.ai{background:#17243a;margin-right:10%}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
.output{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
#errbox{background:#421e29;color:#ffb4c0;padding:10px;border-radius:8px;display:none;margin-bottom:12px}
#toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#263c59;padding:12px;border-radius:10px;display:none;z-index:99}
@media(max-width:700px){
.sidebar{width:64px;padding:6px}
.logo{font-size:12px;text-align:center}
.navbtn{font-size:0;padding:12px 5px;text-align:center}
.navbtn b{font-size:19px}
.main{margin-left:64px;width:calc(100% - 64px);padding:10px}
h1{font-size:20px}
.row{flex-wrap:wrap}
}
</style>
</head>
<body>

<div class="layout">
<aside class="sidebar">
<div class="logo">JARVIS<span> AI</span></div>

<button class="navbtn" onclick="openPage('chat')"><b>💬</b> Chat</button>
<button class="navbtn" onclick="openPage('studio')"><b>🚀</b> Creator Studio</button>
<button class="navbtn" onclick="openPage('video')"><b>🎬</b> Video Studio</button>
<button class="navbtn" onclick="openPage('ads')"><b>📢</b> Ads Studio</button>
<button class="navbtn" onclick="openPage('accounts')"><b>🔗</b> Accounts</button>
<button class="navbtn" onclick="openPage('queue')"><b>📅</b> Queue</button>
<button class="navbtn" onclick="openPage('settings')"><b>⚙️</b> Settings</button>
<button class="navbtn" onclick="newChat()"><b>➕</b> New Chat</button>
</aside>

<main class="main">
<div id="errbox"></div>
<h1 id="heading">Jarvis AI</h1>

<section id="chat" class="page show">
<div class="card">
<h2>AI Chat</h2>
<div id="chatbox" class="chatbox"></div>
<form id="chatForm">
<textarea id="message" placeholder="Jarvis ko message likho..." required></textarea>
<button type="submit" class="btn full" id="sendBtn">Send Message ➤</button>
</form>
</div>
</section>

<section id="studio" class="page">
<div class="card">
<h2>Creator Studio</h2>
<p>Content ideas generate karo.</p>
<input id="niche" placeholder="Channel topic / niche">
<button class="btn full" onclick="ideas()">Generate Ideas</button>
<div id="ideasOut" class="output"></div>
</div>
<div class="card">
<h2>30-Day Planner</h2>
<input id="plannerNiche" placeholder="Channel niche">
<button class="btn full" onclick="planner()">Create Planner</button>
<div id="plannerOut" class="output"></div>
</div>
<div class="card">
<h2>Growth Coach</h2>
<textarea id="growthText" placeholder="Apne channel ki details"></textarea>
<button class="btn full" onclick="growth()">Growth Plan</button>
<div id="growthOut" class="output"></div>
</div>
</section>

<section id="video" class="page">
<div class="card">
<h2>AI Video Studio</h2>
<input id="topic" placeholder="Video topic">
<select id="platform">
<option>YouTube Long Video</option>
<option>YouTube Shorts</option>
<option>Instagram Reel</option>
<option>Facebook Reel</option>
<option>Advertisement</option>
</select>
<select id="duration">
<option>30 seconds</option><option>60 seconds</option>
<option>3 minutes</option><option>5 minutes</option>
<option>10 minutes</option>
</select>
<select id="style">
<option>Faceless cinematic</option>
<option>Documentary</option><option>Educational</option>
<option>Funny</option><option>Motivational</option>
</select>
<button class="btn full" onclick="videoPlan()">Generate Script</button>
<div id="videoOut" class="output"></div>
<button class="btn btn2 full" onclick="saveVideo()">Save Project</button>
</div>
</section>

<section id="ads" class="page">
<div class="card">
<h2>Ads Studio</h2>
<input id="product" placeholder="Product / business name">
<textarea id="productDetails" placeholder="Product details, features, audience"></textarea>
<select id="adPlatform">
<option>All platforms</option><option>YouTube</option>
<option>Instagram</option><option>Facebook</option>
</select>
<button class="btn full" onclick="makeAd()">Generate Ad</button>
<div id="adOut" class="output"></div>
<button class="btn btn2 full" onclick="saveAd()">Save Campaign</button>
</div>
</section>

<section id="accounts" class="page">
<div class="card">
<h2>Connect Accounts</h2>
<p>Abhi account connection configure nahi hua hai. OAuth setup backend par hoga.</p>
<button class="btn full" onclick="connect('YouTube')">Connect YouTube</button>
<button class="btn full" onclick="connect('Instagram')">Connect Instagram</button>
<button class="btn full" onclick="connect('Facebook')">Connect Facebook</button>
<button class="btn full" onclick="connect('Website/API')">Connect Website / API</button>
</div>
</section>

<section id="queue" class="page">
<div class="card">
<h2>Saved Projects</h2>
<button class="btn btn2" onclick="showQueue()">Refresh</button>
<div id="queueOut"></div>
</div>
</section>

<section id="settings" class="page">
<div class="card">
<h2>Supabase Settings</h2>
<label>Project URL</label>
<input id="url" placeholder="https://yourproject.supabase.co">
<label>Public anon key</label>
<input id="key" placeholder="Supabase public key">
<label>Function Name</label>
<input id="fn" value="rapid-worker">
<button class="btn full" onclick="saveSettings()">Save Settings</button>
<button class="btn full btn2" onclick="testConnection()">Test Connection</button>
</div>
</section>
</main>
</div>
<div id="toast"></div>

<script>
/* JARVIS MAIN SCRIPT */
var cfg={};
var historyMessages=[];
var savedProjects=[];
var currentVideo="";
var currentAd="";
var isSending=false;

function el(id){return document.getElementById(id)}

function notify(t){
 el("toast").innerText=t;
 el("toast").style.display="block";
 window.setTimeout(function(){el("toast").style.display="none"},2500);
}

function showError(t){
 el("errbox").style.display="block";
 el("errbox").innerText="ERROR: "+t;
}
function hideError(){
 el("errbox").style.display="none";
}

function openPage(name){
 var pages=document.querySelectorAll(".page");
 for(var i=0;i<pages.length;i++){pages[i].classList.remove("show")}
 var target=el(name);
 if(target){target.classList.add("show")}
 var titles={
 chat:"Jarvis AI Chat",studio:"Creator Studio",
 video:"AI Video Studio",ads:"Ads Studio",
 accounts:"Account Connections",queue:"Saved Projects",
 settings:"Settings"
 };
 el("heading").innerText=titles[name]||"Jarvis";
 hideError();
}

function loadSettings(){
 try{
  cfg=JSON.parse(localStorage.getItem("jarvis_cfg")||"{}");
 }catch(e){cfg={}}
 el("url").value=cfg.url||"https://jiqewyflnbhutrocacyt.supabase.co";
 el("key").value=cfg.key||"";
 el("fn").value=cfg.fn||"rapid-worker";
}

function saveSettings(){
 cfg={
  url:el("url").value.trim().replace(/\/$/,""),
  key:el("key").value.trim(),
  fn:el("fn").value.trim()
 };
 localStorage.setItem("jarvis_cfg",JSON.stringify(cfg));
 notify("Settings saved");
}

function backendReady(){
 if(!cfg.url||!cfg.key||!cfg.fn){
  throw new Error("Settings mein Supabase URL, public key aur function name bharna zaroori hai.");
 }
}

async function callAI(message){
 backendReady();
 var endpoint=cfg.url+"/functions/v1/"+cfg.fn;
 var res=await fetch(endpoint,{
  method:"POST",
  headers:{
   "Content-Type":"application/json",
   "apikey":cfg.key,
   "Authorization":"Bearer "+cfg.key
  },
  body:JSON.stringify({
   message:message,
   history:historyMessages.slice(-16)
  })
 });
 var raw=await res.text();
 var data;
 try{data=JSON.parse(raw)}catch(e){data={reply:raw}}
 if(!res.ok){
  throw new Error("HTTP "+res.status+": "+(data.error||data.message||raw));
 }
 var reply=data.reply||data.text||data.message;
 if(!reply)throw new Error("Backend se reply nahi mila.");
 return reply;
}

/* Chat form */
el("chatForm").addEventListener("submit",async function(event){
 event.preventDefault();
 sendMessage();
});

async function sendMessage(){
 if(isSending)return;
 var text=el("message").value.trim();
 if(!text)return;

 isSending=true;
 el("sendBtn").disabled=true;
 el("sendBtn").innerText="Sending...";
 el("message").value="";
 addChat("user",text);
 historyMessages.push({role:"user",content:text});
 hideError();

 try{
  var reply=await callAI(text);
  addChat("assistant",reply);
  historyMessages.push({role:"assistant",content:reply});
  localStorage.setItem("jarvis_history",JSON.stringify(historyMessages));
 }catch(e){
  showError(e.message);
  addChat("assistant","Request failed: "+e.message);
 }finally{
  isSending=false;
  el("sendBtn").disabled=false;
  el("sendBtn").innerText="Send Message ➤";
 }
}

function addChat(role,text){
 var d=document.createElement("div");
 d.className="msg "+(role==="user"?"user":"ai");
 d.textContent=text;
 el("chatbox").appendChild(d);
 el("chatbox").scrollTop=el("chatbox").scrollHeight;
}

function newChat(){
 historyMessages=[];
 el("chatbox").innerHTML="";
 localStorage.removeItem("jarvis_history");
 openPage("chat");
 notify("New chat");
}

function restoreChat(){
 try{
  historyMessages=JSON.parse(localStorage.getItem("jarvis_history")||"[]");
  historyMessages.forEach(function(m){addChat(m.role,m.content)});
 }catch(e){historyMessages=[]}
}

/* AI tools */
async function runPrompt(prompt,outputId){
 el(outputId).innerText="Jarvis is working...";
 try{
  var result=await callAI(prompt);
  el(outputId).innerText=result;
  return result;
 }catch(e){
  el(outputId).innerText="Error: "+e.message;
  showError(e.message);
  return "";
 }
}

function ideas(){
 var n=el("niche").value.trim();
 if(!n)return notify("Topic enter karo");
 runPrompt("Generate 20 unique content ideas for "+n+". Give title, hook and format. Hindi/Hinglish.", "ideasOut");
}

function planner(){
 var n=el("plannerNiche").value.trim();
 if(!n)return notify("Niche enter karo");
 runPrompt("Create a practical 30 day content calendar for "+n+". Include daily topic, format and hook in Hindi.", "plannerOut");
}

function growth(){
 var n=el("growthText").value.trim();
 if(!n)return notify("Channel details enter karo");
 runPrompt("Give a realistic content improvement plan for this channel: "+n+". Include content pillars, weekly plan, audience engagement and analytics review.", "growthOut");
}

async function videoPlan(){
 var t=el("topic").value.trim();
 if(!t)return notify("Video topic enter karo");
 currentVideo=await runPrompt(
 "Create a complete video script and production plan. Topic: "+t+
 ". Platform: "+el("platform").value+
 ". Duration: "+el("duration").value+
 ". Style: "+el("style").value+
 ". Include title, hook, narration, scenes, captions, thumbnail concept, description and hashtags. Hindi.",
 "videoOut"
 );
}

async function makeAd(){
 var p=el("product").value.trim();
 if(!p)return notify("Product name enter karo");
 currentAd=await runPrompt(
 "Create an advertisement creative for "+p+
 ". Details: "+el("productDetails").value+
 ". Platform: "+el("adPlatform").value+
 ". Include hook, ad script, visual scenes, headline, caption, CTA and hashtags. Avoid invented claims.",
 "adOut"
 );
}

/* Project saving */
function saveProject(type,title,content){
 if(!content)return notify("Pehle content generate karo");
 savedProjects.push({
  id:Date.now(),type:type,title:title,
  content:content,date:new Date().toLocaleString()
 });
 localStorage.setItem("jarvis_projects",JSON.stringify(savedProjects));
 showQueue();
 notify("Project saved");
}

function saveVideo(){
 saveProject("Video",el("topic").value,currentVideo);
}
function saveAd(){
 saveProject("Advertisement",el("product").value,currentAd);
}

function showQueue(){
 try{
  savedProjects=JSON.parse(localStorage.getItem("jarvis_projects")||"[]");
 }catch(e){savedProjects=[]}
 var out=el("queueOut");
 out.innerHTML="";
 if(savedProjects.length===0){
  out.innerHTML="<p>Abhi koi project save nahi hai.</p>";
  return;
 }
 savedProjects.forEach(function(item,index){
  var box=document.createElement("div");
  box.className="card";
  var h=document.createElement("h3");
  h.textContent=item.type+": "+item.title;
  var p=document.createElement("p");
  p.textContent=item.date;
  var view=document.createElement("button");
  view.className="btn";
  view.textContent="View";
  view.onclick=function(){
   alert(item.content);
  };
  var del=document.createElement("button");
  del.className="btn btn2";
  del.textContent="Delete";
  del.onclick=function(){
   savedProjects.splice(index,1);
   localStorage.setItem("jarvis_projects",JSON.stringify(savedProjects));
   showQueue();
  };
  box.appendChild(h);box.appendChild(p);
  box.appendChild(view);box.appendChild(del);
  out.appendChild(box);
 });
}

/* Account placeholders */
function connect(platform){
 alert(platform+" integration abhi connect nahi hai. OAuth aur secure backend setup next phase mein hoga.");
}

/* Backend test */
async function testConnection(){
 saveSettings();
 hideError();
 notify("Testing...");
 try{
  var r=await callAI("Reply only: CONNECTION OK");
  alert("Connected successfully!\n"+r);
 }catch(e){
  showError(e.message);
  alert("Connection failed:\n"+e.message);
 }
}

loadSettings();
restoreChat();
showQueue();
openPage("chat");
</script>
</body>
 </html>
